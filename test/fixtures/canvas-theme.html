<!doctype html><html><head><style>
body{background:#fff;color:#273540} #header{background:#13294b;color:#fff}
.ig-header,.ig-row,.ic-DashboardCard,.ic-Table td,.fc-widget-content,.ui-dialog{background:#fff;color:#273540;border:1px solid #c7cdd1}
.btn,.Button,input,select{background:#fff;color:#273540;border:1px solid #c7cdd1}
a{color:#b74d04}.user_content{background:#fff;color:#273540}
.fc-event{background:#fff;color:#254284;border:1px solid #254284}.context-list-toggle-box{background:#254284}
.alert-success{background:#dceee4;color:#246e4a}.alert-error{background:#fbe0df;color:#a02e32}
#calendar-list-holder{background:#fff}#minical .fc-button,#minical .fc-day-number{color:#636d75}.ic-icon-svg{fill:#13294b}
</style></head><body><header id="header"><a class="ic-app-header__menu-list-link"><svg class="ic-icon-svg"><path></path></svg>Canvas</a></header>
<div id="wrapper"><nav id="section-tabs"><a>Modules</a></nav><main id="content">
<section class="item-group-condensed"><div class="ig-header">Unit One</div><div class="ig-row"><a class="ig-title">Reading</a></div></section>
<article class="ic-DashboardCard"><div class="ic-DashboardCard__header_image" data-protected="swatch" style="background-color:#24634b"></div><div class="ic-DashboardCard__header_content">Course</div></article>
<div id="calendar-app"><table><tbody><tr><td class="fc-widget-content">1<a class="fc-event" data-protected><span class="fc-title">Essay</span></a></td></tr></tbody></table></div>
<div id="right-side"><div id="minical"><button class="fc-button">Next month</button><button class="fc-day-number">1</button></div><div id="calendar-list-holder"><ul id="calendars-context-list"><li><span class="context-list-toggle-box" data-protected="swatch"></span><label>Course</label></li></ul></div></div>
<button class="btn" id="neutral-button">Choose</button><input id="neutral-input" placeholder="Search"><select><option>All</option></select>
<table class="ic-Table"><tbody><tr><td id="neutral-cell">Assignment</td><td><span class="alert-success" data-protected>Submitted</span></td></tr></tbody></table>
<p class="alert-error" data-protected>Late</p><div class="ui-dialog"><button class="btn">Done</button></div>
<div class="user_content"><span data-protected style="color:#aa0033">Teacher color</span><button class="btn" data-protected>Content button</button><table class="ic-Table"><tbody><tr><td data-protected>Content table</td></tr></tbody></table><a data-protected>Content link</a><code data-protected style="color:#aa0033;background:#fff">Code</code></div>
<svg data-protected style="color:#cc0000"><path fill="#cc0000"></path></svg><canvas data-protected="media"></canvas><img data-protected="media" alt="Illustration"><iframe data-protected="media" title="Embedded tool"></iframe>
</main></div></body></html>
